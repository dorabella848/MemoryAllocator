# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: Run Tests on Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]
env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  # Run the unit tests via ctest and valgrind
  Test:
    runs-on: ubuntu-latest
    working-directory: ${{github.workspace}}/allocatorRoot

    steps:
    - uses: actions/checkout@v4

    - name: Install Ninja
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Configure
      run: cmake --preset ${{env.BUILD_TYPE}} -DEnableTests=ON

    - name: Build
      run: cmake --build --preset ${{env.BUILD_TYPE}}

    - name: Run Gtests
      run: ./build/${{env.BUILD_TYPE}}/allocatortest # Dont want to run the length valgrind if there is an inherent error with the logic in the code
    
    - name: Install Valgrind
      run: sudo apt-get update && sudo apt-get install -y valgrind

    - name: Run Gtests via Valgrind
      working-directory: ${{github.workspace}}/allocatorRoot/build/${{env.BUILD_TYPE}}
      run: |
        valgrind --leak-check=full --show-leak-kinds=all --error-exitcode=1 ./allocatortest
        valgrind --leak-check=full --show-leak-kinds=all --error-exitcode=1 ./STLallocatortest

  # Generate .deb package
  GenPackage:
    runs-on: ubuntu-latest
    working-directory: ${{github.workspace}}/allocatorRoot
    steps:
    - uses: actions/checkout@v4

    - name: Configure
      run: cmake --preset ${{env.BUILD_TYPE}} -DEnableTests=ON

    - name: Build
      run: cmake --build --preset ${{env.BUILD_TYPE}}

    - name: Create .deb package
      working-directory: build
      run: cpack -G DEB

    - name: Upload .deb package
      uses: actions/upload-artifact@v4
      with:
        name: MemoryAllocatorDEB
        path: build/*.deb

  runDebPackage:
    runs-on: ubuntu-latest
    needs: GenPackage
    steps:
    - uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: MemoryAllocatorDEB
        path: build

    - name: Install .deb package
      run:
        sudo dpkg -i build/memoryallocator-*.deb
      
    - name: Verify installtion
      run:
        dpkg -l | grep memoryallocator

    - name: Install Clang
      run: sudo apt-get update && sudo apt-get install -y clang

    - name: Test package
      run: |
        echo -e '#include <STL_Allocator/Allocator.hpp>\nint main() { Allocator alloc(1); void* ptr = alloc.malloc(1); alloc.free(ptr); return 0; }' > test.cpp 
        clang++ test.cpp -lmemoryallocator -o test
        ./test

    # The test app has been made but wont be implemented here just yet
